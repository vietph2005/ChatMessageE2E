spring.application.name=ChatMessageE2E
server.port=${SERVER_PORT:8080}

# # Optional local overrides (Ignored by Git)
# spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/chat_message_app
spring.data.mongodb.auto-index-creation=true

# JWT & Cookie Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=jwt_token

# Google OAuth2 Configuration
google.client.id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

