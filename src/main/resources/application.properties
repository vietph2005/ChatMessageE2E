# ===================================================================
# ChatMessageE2E Application Configuration
# Configuration Integrity per Constitution Principle VII
# ===================================================================

spring.application.name=ChatMessageE2E
server.port=${SERVER_PORT:8080}

# Optional local overrides (Ignored by Git)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties

# MongoDB Configuration (Environment variable with safe local fallback)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_message_e2e}
spring.data.mongodb.auto-index-creation=true

# Google OAuth2 Client Credentials (Populate in application-local.properties or ENV)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_PLACEHOLDER}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_PLACEHOLDER}

# JWT Stateless Token Configuration
jwt.secret=${JWT_SECRET:c3VwZXJfc2VjdXJlX2tleV9mb3JfZGV2X3Rlc3Rpbmdfb25seV8yNTZiaXRzX2xvbmdfc3RyaW5nIQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging Configuration with Structured MDC Trace IDs
logging.level.root=INFO
logging.level.org.example.chat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-NONE}] %-5level %logger{36} - %msg%n

# Media Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
